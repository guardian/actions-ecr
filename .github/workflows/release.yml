name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: 'false'

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.tool-versions'
          cache: npm
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Use GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app-token
        with:
          client-id: ${{ secrets.GU_CHANGESETS_APP_ID }}
          private-key: ${{ secrets.GU_CHANGESETS_PRIVATE_KEY }}

      - name: Set git user to Gu Changesets app
        run: |
          git config user.name "gu-changesets-release-pr[bot]"
          git config user.email "gu-changesets-release-pr[bot]@users.noreply.github.com"

      - name: Create release Pull Request if required
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          pr-title: '🦋 Release package updates'
          commit-message: 'Bump version'
          github-token: ${{ steps.app-token.outputs.token }}
          create-github-releases: true
          push-git-tags: true
          publish-script: npx changeset git-tag
